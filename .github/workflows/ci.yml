name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug-profile extension builds keep the Python jobs fast; benchmarks never run in CI.
  MATURIN_PEP517_ARGS: "--profile dev"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Data-file guard (NFR-09)
        run: bash scripts/check_data_files.sh
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Fill-rule coverage (AC-W-03)
        run: python3 scripts/check_fill_rule_coverage.py
      - name: Python env (builds the extension)
        run: uv sync --python 3.12 --locked
      - name: clippy
        run: PYO3_PYTHON="$(uv python find 3.12)" cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: ruff
        run: |
          uv run --frozen ruff check python tests/python scripts strategies
          uv run --frozen ruff format --check python tests/python scripts strategies
      - name: mypy --strict
        run: |
          uv run --frozen mypy
          uv run --frozen mypy --strict strategies
      - name: stubtest
        run: uv run --frozen python -m mypy.stubtest edbt._edbt
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        run: cargo nextest run --workspace --exclude edbt-py --locked

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: uv sync (builds the extension)
        run: uv sync --python ${{ matrix.python }} --locked
      - name: pytest
        run: uv run --frozen pytest -m "not data and not testnet"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # NFR-06: >= 85% workspace lines (edbt-cli main excluded), >= 90% on
      # edbt-exchange and edbt-ledger, >= 85% on python/edbt (studies excluded).
      - name: Rust line coverage
        run: |
          cargo llvm-cov nextest --workspace --exclude edbt-py --locked --ignore-filename-regex "edbt-cli/src/main.rs" --fail-under-lines 85
          cargo llvm-cov report --ignore-filename-regex "edbt-cli/src/main.rs" --summary-only > coverage-summary.txt
          python3 scripts/check_crate_coverage.py coverage-summary.txt edbt-exchange=90 edbt-ledger=90
      - name: Python line coverage
        run: |
          uv sync --python 3.12 --locked
          uv run --frozen pytest -m "not data and not testnet" --cov=edbt --cov-report=term-missing --cov-fail-under=85

  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build edbt (release)
        run: cargo build --release --locked -p edbt-cli
      - name: Same seed twice, then another seed (AC-W-01)
        shell: bash
        run: EDBT=target/release/edbt bash scripts/determinism.sh _determinism
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: _determinism/a/hashes.json

  # Linux vs Windows hashes: reported, not gating (NFR-04 "Should").
  determinism-cross-os:
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Compare run hashes across operating systems
        run: |
          for f in determinism-*/hashes.json; do echo "$f $(jq -r .run_hash "$f")"; done
          if [ "$(jq -r .run_hash determinism-ubuntu-latest/hashes.json)" = "$(jq -r .run_hash determinism-windows-latest/hashes.json)" ]; then
            echo "Linux and Windows run hashes are equal"
          else
            echo "Linux and Windows run hashes differ (reported, not gating)"
            jq -n --slurpfile l determinism-ubuntu-latest/hashes.json --slurpfile w determinism-windows-latest/hashes.json               '$l[0].files | to_entries | map(select(.value != $w[0].files[.key]) | .key)'
          fi

  # Not gating: smoke-runs the benchmarks. Numbers from shared runners are
  # not performance claims (spec section 16).
  bench-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: criterion --quick
        run: cargo bench -p edbt-core --bench engine -- --quick
      - name: edbt bench and the Python throughput study on 1M synthetic rows
        env:
          MATURIN_PEP517_ARGS: ""
        run: |
          cargo build --release --locked -p edbt-cli
          ./target/release/edbt bench --mode engine --strategy noop --events 1000000 --reps 3
          ./target/release/edbt bench --mode e2e --strategy mm_simple --events 1000000 --reps 3
          uv sync --python 3.12 --locked
          {
            echo '[throughput]'
            echo 'events = 1000000'
            echo 'reps = 2'
            echo "edbt = \"$PWD/target/release/edbt\""
          } > "$RUNNER_TEMP/thr.toml"
          uv run --frozen edbt-study throughput --config "$RUNNER_TEMP/thr.toml" --out "$RUNNER_TEMP/reports"
          cat "$RUNNER_TEMP/reports/throughput.md"

  # The single required status check for branch protection.
  ci:
    if: always()
    needs: [lint, test, python, coverage, determinism]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

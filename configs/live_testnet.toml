# Binance USD-M futures TESTNET session: strategies/mm_simple.py at minimum
# size on BTCUSDT (AC-W-07 testnet half). Paper mode is the same file with
# run.mode = "paper" (configs/paper_testnet.toml).
#
#   edbt live --config configs/live_testnet.toml --duration 10m --record --i-understand-testnet-only
#
# Endpoints follow the USD-M "General Info" page (testnet REST
# https://demo-fapi.binance.com, WebSocket wss://demo-fstream.binance.com;
# page last modified 2026-10-30, read 2026-11-03) and the 2026-04-23 path
# routing (/public, /market, /private). The first testnet connection
# confirms them; docs/decisions.md records the result. Mainnet hosts are
# refused at load and per request by the host guard; keys are read only from
# BINANCE_TESTNET_API_KEY / BINANCE_TESTNET_API_SECRET.

[run]
name = "mm_simple_testnet"
mode = "testnet"
seed = 20261103
event_log = "full"

[data]
venue = "binance-usdm-testnet"
symbols = ["BTCUSDT"]
book = "book_l2"
trades = true
instruments = "configs/instruments.toml"

# Used only in paper mode (testnet fills come from the venue).
[latency.feed]
model = "recorded"
[latency.order]
model = "constant"
entry_ns = 10_000_000     # placeholder until `edbt latency fit` on testnet rows
response_ns = 10_000_000

[queue]
model = "prob_power"
power = 2.0

[fees]
source = "instruments"

[risk]
max_position_lots = 120
max_open_orders = 10
max_order_qty_lots = 10
max_order_notional = 1000.0
max_orders_per_sec = 10
max_cancels_per_sec = 20
price_band_bps = 50.0
kill_max_loss = 200.0
kill_max_drawdown = 200.0
kill_stale_feed_ms = 30_000
kill_reject_burst = 50     # post-only crosses do not count (docs/decisions.md)
flatten_on_kill = true

[ledger]
initial_cash = 10000.0
quote_currency = "USDT"

[strategy]
kind = "python"
path = "strategies/mm_simple.py"
class = "MarketMaker"
[strategy.params]
# Minimum size: venue minimum notional (exchangeInfo, 2026-11-03) with about
# 25% room for price moves; skew of about 1 tick per order of inventory.
half_spread_ticks = 1
order_qty = 0.0008
max_inventory = 0.008
skew_ticks_per_unit = 1250.0
refresh_ns = 500_000_000

[live]
venue = "binance-usdm-testnet"
rest_url = "https://demo-fapi.binance.com"
ws_market_url = "wss://demo-fstream.binance.com"
ws_api_url = "wss://testnet.binancefuture.com/ws-fapi/v1"   # unused: order_channel = "rest"
allowed_hosts = ["testnet.binancefuture.com", "stream.binancefuture.com",
                 "fstream.binancefuture.com", "demo-fapi.binance.com", "demo-fstream.binance.com"]
# Additional REST base URLs that `just testnet-ping` checks for reachability.
ping_urls = ["https://testnet.binancefuture.com", "https://demo-fapi.binance.com"]
ws_public_path = "/public/stream"
ws_market_path = "/market/stream"
ws_private_path = "/private/ws/{listen_key}"
order_channel = "rest"
depth_stream = "depth@100ms"
record = true
record_dir = "data"        # $DATA_ROOT; canonical partitions under venue=binance-usdm-testnet
recv_window_ms = 5000
clock_sync_interval_s = 60
session_dir = "results/live"
status_interval_s = 10
reconcile_interval_s = 60
tick_interval_ms = 1000
min_free_gb = 5.0
disk_warn_pct = 80.0
max_conn_age_h = 23.0
stale_after_s = 30
end_on_kill = false

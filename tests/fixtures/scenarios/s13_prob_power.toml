# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s13_prob_power"
rule = "l2_prob_power_cancel_advances_expected_fraction"
description = "prob_power n=2. Behind 10, 10 join behind, 4 cancelled: half assumed ahead, 8 left ahead. Prints of 8 then 1 at 100: the second fills 1."

[setup]
queue = "prob_power"
power = 2.0

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 10]]
asks = [[101, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 1
price = 100
[[events]]
t = 20
kind = "level"
side = "bid"
price = 100
qty = 20
[[events]]
t = 30
kind = "level"
side = "bid"
price = 100
qty = 16
[[events]]
t = 40
kind = "trade"
side = -1
price = 100
qty = 8
[[events]]
t = 50
kind = "trade"
side = -1
price = 100
qty = 1
[[expected]]
ref = "A"
responses = ["accepted", "fill 100 1 maker -50000"]

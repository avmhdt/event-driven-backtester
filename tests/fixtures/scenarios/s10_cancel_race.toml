# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s10_cancel_race"
rule = "cancel_in_flight_can_still_fill"
description = "10 ns entry and response latency. A cancel sent at 20 reaches the exchange at 30; a print at 25 fills first."

[setup]
entry_ns = 10
response_ns = 10

[[events]]
t = 0
kind = "snapshot"
bids = [[99, 5]]
asks = [[102, 5]]
[[events]]
t = 0
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 3
price = 100
[[events]]
t = 20
kind = "cancel"
ref = "A"
[[events]]
t = 25
kind = "trade"
side = -1
price = 100
qty = 3
[[expected]]
ref = "A"
responses = ["accepted", "fill 100 3 maker -150000", "cancel_rejected UNKNOWN_ORDER"]

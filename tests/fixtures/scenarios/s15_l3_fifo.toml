# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s15_l3_fifo"
rule = "l3_cancel_ahead_advances_queue"
description = "L3 FIFO: buy 4 at 100 behind orders 1 (5) and 2 (3). Both execute; order 3 joins behind; its executions of 2 and 4 now reach us."

[setup]
queue = "l3_fifo"
l3 = true

[[events]]
t = 0
kind = "l3"
op = "add"
id = 1
side = "bid"
price = 100
qty = 5
[[events]]
t = 0
kind = "l3"
op = "add"
id = 2
side = "bid"
price = 100
qty = 3
[[events]]
t = 0
kind = "l3"
op = "add"
id = 9
side = "ask"
price = 102
qty = 10
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 4
price = 100
[[events]]
t = 20
kind = "l3"
op = "exec"
id = 1
side = "bid"
price = 100
qty = 5
[[events]]
t = 30
kind = "l3"
op = "exec"
id = 2
side = "bid"
price = 100
qty = 3
[[events]]
t = 40
kind = "l3"
op = "add"
id = 3
side = "bid"
price = 100
qty = 6
[[events]]
t = 50
kind = "l3"
op = "exec"
id = 3
side = "bid"
price = 100
qty = 2
[[events]]
t = 60
kind = "l3"
op = "exec"
id = 3
side = "bid"
price = 100
qty = 4
[[expected]]
ref = "A"
responses = ["accepted", "fill 100 2 maker -100000", "fill 100 2 maker -100000"]

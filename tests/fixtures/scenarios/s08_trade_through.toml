# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s08_trade_through"
rule = "trade_through_fills_resting_order"
description = "Buy 3 at 100 behind 5; a sell prints at 99, through our price: all 3 fill at 100."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 3
price = 100
[[events]]
t = 20
kind = "trade"
side = -1
price = 99
qty = 1
[[expected]]
ref = "A"
responses = ["accepted", "fill 100 3 maker -150000"]

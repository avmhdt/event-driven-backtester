# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s02_partial_then_rest"
rule = "crossing_partial_then_rests_remainder"
description = "A buy at 101 for 5 takes the 2 offered and rests 3 at 101 first in queue; a sell print of 1 at 101 fills 1 as maker (-500*101)."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 5
price = 101
[[events]]
t = 20
kind = "trade"
side = -1
price = 101
qty = 1
[[expected]]
ref = "A"
responses = ["accepted", "fill 101 2 taker 404000", "fill 101 1 maker -50500"]

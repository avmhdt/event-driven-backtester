# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s16_stp"
rule = "self_trade_prevention_cancel_newest"
description = "Our resting sell at 101; our buy at 101 would trade with it: the buy expires."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "sell"
type = "limit"
tif = "gtc"
qty = 1
price = 101
[[events]]
t = 20
kind = "order"
ref = "B"
side = "buy"
type = "limit"
tif = "gtc"
qty = 1
price = 101
[[expected]]
ref = "A"
responses = ["accepted"]
[[expected]]
ref = "B"
responses = ["expired STP"]

# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s06_post_only"
rule = "post_only_rejected_when_crossing"
description = "Post-only buy at 101 would take: rejected. At 100: accepted and resting."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtx"
qty = 1
price = 101
[[events]]
t = 20
kind = "order"
ref = "B"
side = "buy"
type = "limit"
tif = "gtx"
qty = 1
price = 100
[[expected]]
ref = "A"
responses = ["rejected POST_ONLY_WOULD_CROSS"]
[[expected]]
ref = "B"
responses = ["accepted"]

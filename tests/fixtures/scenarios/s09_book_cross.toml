# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s09_book_cross"
rule = "book_cross_fills_resting_order_at_own_price"
description = "Buy 3 at 100 above the displayed best bid of 99; an ask appears at 100: filled at our price."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[99, 4]]
asks = [[101, 2], [102, 3]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 3
price = 100
[[events]]
t = 20
kind = "level"
side = "ask"
price = 100
qty = 1
[[expected]]
ref = "A"
responses = ["accepted", "fill 100 3 maker -150000"]

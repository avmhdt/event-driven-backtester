# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s01_walk_levels"
rule = "crossing_limit_fills_at_best_and_walks_levels"
description = "A buy at 102 for 4 takes 2 at 101 and 2 at 102. Fees 101*2*2000 and 102*2*2000."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 4
price = 102
[[expected]]
ref = "A"
responses = ["accepted", "fill 101 2 taker 404000", "fill 102 2 taker 408000"]

# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s18_book_invalid"
rule = "no_fill_while_book_invalid"
description = "After a sequence gap the book is invalid: a resting order is not filled and a new one is rejected."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "buy"
type = "limit"
tif = "gtc"
qty = 3
price = 100
[[events]]
t = 20
kind = "gap_level"
side = "ask"
price = 102
qty = 0
[[events]]
t = 30
kind = "trade"
side = -1
price = 99
qty = 3
[[events]]
t = 40
kind = "order"
ref = "B"
side = "buy"
type = "limit"
tif = "gtc"
qty = 1
price = 98
[[expected]]
ref = "A"
responses = ["accepted"]
[[expected]]
ref = "B"
responses = ["rejected BOOK_INVALID"]

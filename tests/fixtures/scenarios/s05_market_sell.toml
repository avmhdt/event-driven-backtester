# Hand-computed fill scenario (AC-W-03). Prices in ticks of 0.01, sizes in
# lots of 1, so one lot at one tick is 0.01 quote = 10,000,000 nano-quote.
# Fees: maker -0.5 bps -> -500 nq per tick-lot; taker 2 bps -> 2,000 nq per
# tick-lot. Runner: crates/edbt-exchange/tests/scenarios.rs.

name = "s05_market_sell"
rule = "market_order_walks_book_taker_fee"
description = "Market sell 6 against bids 100x5 and 99x4."

[setup]

[[events]]
t = 0
kind = "snapshot"
bids = [[100, 5], [99, 4]]
asks = [[101, 2], [102, 3], [104, 5]]
[[events]]
t = 10
kind = "order"
ref = "A"
side = "sell"
type = "market"
tif = "ioc"
qty = 6
[[expected]]
ref = "A"
responses = ["accepted", "fill 100 5 taker 1000000", "fill 99 1 taker 198000"]

# cargo-deny: licences, advisories, bans and sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # atomic-polyfill is archived (unmaintained notice, no vulnerability). It is
  # pulled in by postcard -> heapless 0.7 only for targets without native
  # atomics, so it is never built for x86_64 Linux or Windows. postcard 1.x
  # has no release without it.
  { id = "RUSTSEC-2023-0089", reason = "unmaintained, target-gated, not compiled on supported targets" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# No OpenSSL anywhere: live I/O uses rustls (spec section 4).
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

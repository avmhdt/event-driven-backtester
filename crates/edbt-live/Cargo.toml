[package]
name = "edbt-live"
description = "Binance USD-M futures testnet adapter, recorder, latency measurement and host guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
edbt-core.workspace = true
edbt-data.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
ureq.workspace = true
tungstenite.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
tiny_http.workspace = true
fs4.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
float_cmp = "deny"
# Not a simulation crate: wall clocks and threads are allowed here (NFR-04).
disallowed_methods = "allow"
disallowed_types = "allow"

[package]
name = "edbt-cli"
description = "The edbt command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "edbt"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
edbt-exchange.workspace = true
edbt-strategies.workspace = true
edbt-ledger.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
serde_json.workspace = true
blake3.workspace = true
tempfile.workspace = true
edbt-core.workspace = true
edbt-data.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
insta = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
float_cmp = "deny"
# Not a simulation crate: wall clocks and threads are allowed here (NFR-04).
disallowed_methods = "allow"
disallowed_types = "allow"
